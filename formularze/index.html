<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>FORMULARZ ZGŁOSZENIOWY</h1>
    <form action="#" method="post">
        <label for="imie">Imię:</label>
        <input type="text" id="imie" name="imie" required><br><br>

        <label for="nazwisko">Nazwisko:</label>
        <input type="text" id="nazwisko" name="nazwisko" required><br><br>

        <label for="gender">Płeć:</label>
        <input type="radio" id="gender" name="gender" value="male" required>
        <label for="gender">Mężczyzna</label>
        <input type="radio" id="gender" name="gender" value="female" required>
        <label for="gender">Kobieta</label><br><br>

        <label for="adres">adres:</label>
        <input type="text" id="adres" name="adres" placeholder="podaj pełny adres"><br><br>

        <label for="data_urodzenia">data urodzenia:</label><br>
        <input type="date" id="data_urodzenia" name="data_urodzenia" required><br><br>

        <label for="password">Hasło:</label>
        <input type="password" id="password" name="password" placeholder="wielkie małe litery i cyfry"><br><br>

        <label for="kurs">jakim kursem jestes zainteresowany:</label><br>
        <select id="kurs" name="kurs" required>
            <option value="">Wybierz kurs</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
        </select><br><br>
        <label for="ilosc_kursow">z ilu kursow (maksymalnie) chcialbys skorzystac?</label>
        <input type="number" id="ilosc_kursow" name="ilosc_kursow" min="1" max="3" required><br><br>

        <label for='kolor'>jaki kolor lubisz najbardziej?</label><br>
        <input type="color" id="kolor" name="kolor" required><br><br>
        
        <label for='file'>dołącz plik:</label>
        <input type="file" id="file" name="file" required><br><br>

        <label for="zgoda">wyrazam zgode na przetwarzanie danych osobowych</label>
        <input type="checkbox" id="zgoda" name="zgoda" required><br><br>
        <label for="regulamin">zapoznalem sie z regulaminem</label>
        <input type="checkbox" id="regulamin" name="regulamin" required><br><br>

        <label for="range">poziom znajomości:</label>
        <input type="range" id="range" name="range" min="0" max="100" value="50"><br><br>

        <input type="submit" value="Wyślij">
        <input type="reset" value="Wyczyść">
</body>
</html>
