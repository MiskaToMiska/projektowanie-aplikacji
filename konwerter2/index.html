<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sahurski Konwerter Jednostek</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥸</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="app-header">
        <h1>Sahurski Konwerter</h1>
      </header>

      <div class="image-container">
        <img
          src="./screenshot-2025-05-09-192850.webp"
          alt="tung tung"
          class="funny-img"
        />
      </div>

      <label for="konwerter_box" class="title">
        Przelicz <span class="one">m</span> na <span class="two">ft</span>
      </label>

      <input
        type="number"
        id="konwerter_box"
        placeholder="Wpisz liczbę..."
        autocomplete="off"
      />

      <p class="result"></p>

      <div class="przyciski">
        <button class="przycisk" id="convert">Konwertuj</button>
        <button class="przycisk" id="reset">Reset</button>
        <button class="przycisk" id="change">Zmień</button>
      </div>

      <div class="przyciski2">
        <button class="przycisk" id="m_km">M / KM</button>
        <button class="przycisk" id="m_ft">M / FT</button>
        <button class="przycisk" id="m_mi">M / MILE</button>
        <button class="przycisk" id="mi_km">MI / KM</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
