<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konwerter Jednostek</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <label for="konwerter_box">
      Konwerter
      <span class="one">m</span>
      na
      <span class="two">ft</span>
    </label>
    <input
      type="number"
      id="konwerter_box"
      name="konwerter_box"
      placeholder="Wpisz liczbę..."
    />
    <p class="result"></p>
    <div class="przyciski">
      <button class="przycisk" id="convert">Konwertuj</button>
      <button class="przycisk" id="reset">Reset</button>
      <button class="przycisk" id="change">Zmień</button>
    </div>
    <div class="przyciski2">
      <button class="przycisk" id="m_km">M / KM</button>
      <button class="przycisk" id="m_ft">M / FT</button>
      <button class="przycisk" id="m_mi">M / MILE</button>
      <button class="przycisk" id="mi_km">MI / KM</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
